# Gradle / JVM
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# This machine sits behind a fake-ip transparent proxy: Java TLS 1.3 handshakes to
# dl.google.com / plugins.gradle.org are terminated by the peer. TLS 1.2 works, so pin it.
systemProp.jdk.tls.client.protocols=TLSv1.2

# No AndroidX widgets are used, but dependency metadata may reference androidx.*
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Self-signed release keystore: android/keystore/webgrab.jks (keytool generated)
WEBGRAB_STORE_FILE=keystore/webgrab.jks
WEBGRAB_STORE_PASSWORD=webgrab2026
WEBGRAB_KEY_ALIAS=webgrab
WEBGRAB_KEY_PASSWORD=webgrab2026
